# Filtered devices: Cloudflare for Families (adult content + malware blocked).
port=53
listen-address=10.7.0.1
bind-dynamic
no-resolv
no-hosts
server=1.1.1.3
server=1.0.0.3
cache-size=4000
log-queries=extra
log-async=100
log-facility=/var/log/serdab/dns-filtered.log
# Keep browsers and phones on this resolver: no DNS-over-HTTPS, no iCloud Private Relay.
address=/use-application-dns.net/
address=/mask.icloud.com/
address=/mask-h2.icloud.com/
address=/dns.google/
address=/dns.google.com/
address=/cloudflare-dns.com/
address=/one.one.one.one/
address=/dns.quad9.net/
address=/doh.opendns.com/
address=/dns.nextdns.io/
address=/doh.cleanbrowsing.org/
address=/dns.adguard-dns.com/
address=/dns.adguard.com/
address=/doh.mullvad.net/
