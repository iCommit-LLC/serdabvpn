# Unfiltered devices (the owner by default). serdabd stores nothing for devices that are not logged.
port=5300
listen-address=10.7.0.1
bind-dynamic
no-resolv
no-hosts
server=1.1.1.1
server=1.0.0.1
cache-size=4000
log-queries=extra
log-async=100
log-facility=/var/log/serdab/dns-open.log
# iOS/macOS encrypted-DNS upgrade (DDR) and iCloud Private Relay: refuse both,
# so phones keep asking this resolver (the site history and the filter depend on it).
address=/resolver.arpa/
address=/use-application-dns.net/
address=/mask.icloud.com/
address=/mask-h2.icloud.com/
address=/doh.dns.apple.com/
